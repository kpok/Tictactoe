name: Google Play · Internal Testing

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Unique integer greater than every versionCode already uploaded to Play
        required: true
        type: string
      publish:
        description: Upload to Google Play Internal Testing (false builds a signed AAB for first manual upload)
        type: boolean
        default: false
      release_status:
        description: Use draft until the Play app setup is complete; completed distributes to internal testers
        type: choice
        options: [draft, completed]
        default: draft

permissions: {}


jobs:
  validate:
    if: >-
      github.repository == 'kpok/Tictactoe' &&
      github.repository_id == '969630128' &&
      github.repository_owner_id == '10676481' &&
      github.actor_id == '10676481' &&
      github.actor == 'kpok' &&
      github.triggering_actor == 'kpok' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    concurrency:
      group: trusted-threefold-validate
      cancel-in-progress: false
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Require main and validate operator versionCode
        env:
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo '::error::Internal releases must run on main'; exit 1; }
          node scripts/android-version.js

  verify:
    if: >-
      github.repository == 'kpok/Tictactoe' &&
      github.repository_id == '969630128' &&
      github.repository_owner_id == '10676481' &&
      github.actor_id == '10676481' &&
      github.actor == 'kpok' &&
      github.triggering_actor == 'kpok' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    needs: validate
    uses: ./.github/workflows/ci-pipeline.yml
    with:
      version_code: ${{ inputs.version_code }}
    # Deliberately do not inherit signing or Google Play secrets into tests.

  sign-and-publish:
    if: >-
      github.repository == 'kpok/Tictactoe' &&
      github.repository_id == '969630128' &&
      github.repository_owner_id == '10676481' &&
      github.actor_id == '10676481' &&
      github.actor == 'kpok' &&
      github.triggering_actor == 'kpok' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    concurrency:
      group: trusted-threefold-sign-and-publish
      cancel-in-progress: false
    name: Sign verified AAB · optionally upload to internal only
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: google-play-internal
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
      ADS_PRIVACY_URL: ${{ vars.ADS_PRIVACY_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: threefold-android-${{ github.sha }}
          path: android-artifacts/
      - name: Verify exact tested source and artifact hashes
        run: node scripts/verify-android-artifacts.js
      - name: Validate release credentials and sign previously built AAB
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ inputs.publish && secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || '' }}
          PUBLISH_TO_PLAY: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing environment secret: $name"; exit 1; }
          done
          if [ "$PUBLISH_TO_PLAY" = true ]; then
            test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || { echo '::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'; exit 1; }
          fi
          if unzip -Z1 android-artifacts/app-release-unsigned.aab | grep -Ei '^META-INF/[^/]+\.(RSA|DSA|EC|SF)$'; then
            echo '::error::Expected unsigned AAB, refusing existing signing identity'; exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/threefold-upload.jks"
          mkdir -p signed-android
          jarsigner -keystore "$RUNNER_TEMP/threefold-upload.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar signed-android/threefold.aab \
            android-artifacts/app-release-unsigned.aab "$ANDROID_KEY_ALIAS"
          jarsigner -verify signed-android/threefold.aab
          keytool -exportcert -keystore "$RUNNER_TEMP/threefold-upload.jks" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/threefold-upload-cert.der"
          python3 scripts/android_release.py signature signed-android/threefold.aab --certificate "$RUNNER_TEMP/threefold-upload-cert.der"
      - name: Upload only to Google Play Internal Testing
        if: inputs.publish
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kpok.threefold
          releaseFiles: signed-android/threefold.aab
          tracks: internal
          status: ${{ inputs.release_status }}
      - name: Signed AAB for manual bootstrap or audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: threefold-signed-aab-${{ inputs.version_code }}
          path: signed-android/threefold.aab
          if-no-files-found: error
          retention-days: 1
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/threefold-upload.jks" "$RUNNER_TEMP/threefold-upload-cert.der"
