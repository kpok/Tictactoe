name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version_code:
        description: Android versionCode for this verified artifact
        type: string
        default: '1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-unit-tests:
    name: Node ${{ matrix.node }} · build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: threefold-web
          path: dist/
          if-no-files-found: error
          retention-days: 14
  playwright:
    name: Playwright · desktop, Android viewport, iPhone WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  android-build:
    name: Android · APK, instrumentation APK and unsigned AAB
    needs: build-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Validate version code
        run: node scripts/android-version.js
      - name: Bundle offline assets and synchronize native project
        run: npm run android:sync
      - name: Build Android packages
        working-directory: android
        run: ./gradlew --no-daemon -PversionCode="$ANDROID_VERSION_CODE" assembleDebug assembleDebugAndroidTest bundleRelease
      - name: Collect immutable Android artifacts
        run: node scripts/android-artifacts.js
      - uses: actions/upload-artifact@v4
        with:
          name: threefold-android-${{ github.sha }}
          path: android-artifacts/
          if-no-files-found: error
          retention-days: 7

  android-emulator-e2e:
    name: Android · real emulator E2E
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: threefold-android-${{ github.sha }}
          path: android-artifacts/
      - name: Verify same-revision Android artifacts
        run: node scripts/verify-android-artifacts.js
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reserve emulator disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 9437184
      - name: Test installed APK offline on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/run-android-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-results
          path: android-e2e-results/
          if-no-files-found: warn
          retention-days: 7
